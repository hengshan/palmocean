[project]
name = "palmview-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.1",
    "Pillow>=10.0",
    "httpx>=0.28.1",
    "numpy>=2.4.2",
    "aiofiles>=25.1.0",
    "python-jose[cryptography]>=3.5.0",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "python-dotenv>=1.2.1",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
s3 = ["boto3>=1.34"]
dev = ["ruff>=0.2", "pytest>=8.0"]

[tool.ruff]
target-version = "py311"
line-length = 120
